services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kacper
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - postgres
  
  etl:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:kacper@postgres:5432/market_data

volumes:
  postgres_data: